function render(){const term=q.value.trim().toLowerCase(),d=I[lang],v=V[lang];const rows=S.filter(x=>{const p=priceOf(x[0]),r=ratingOf(x[0]),a=window.SITE_STATUS?.[x[1]];return(cat===0||x[2]===cat)&&(!term||[x[0],x[1],d.cats[x[2]],d.desc[x[3]],d.prices[p],v.levels[r],a?.state||'unknown'].join(' ').toLowerCase().includes(term))});document.querySelector('#resultCount').textContent=`${rows.length} ${d.results}`;grid.innerHTML=rows.length?rows.map((x,i)=>{const p=priceOf(x[0]),r=ratingOf(x[0]),domain=new URL(x[1]).hostname.replace(/^www\./,''),a=window.SITE_STATUS?.[x[1]]||{state:'unknown',checked:'—'},si=a.state==='up'?0:a.state==='issue'?1:2,icon=window.SITE_ICONS?.[x[1]],initials=x[0].replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase();return`<a class="card" href="${x[1]}" target="_blank" rel="noopener" style="--hue:${(x[0].charCodeAt(0)*17+i*23)%360}" aria-label="${x[0]}"><div class="card-top"><span class="logo"><span>${initials}</span>${icon?`<img src="${icon}" alt="" loading="lazy" onerror="this.remove()">`:''}</span><span class="card-actions"><span class="kind">${E[x[2]]}</span><span class="arrow">↗</span></span></div><h3>${x[0]}</h3><span class="domain">${domain}</span><div class="card-info"><div class="info-row"><span class="info-label">${v.use}</span>${d.desc[x[3]]}</div><div class="info-row"><span class="info-label">${v.review}</span><span class="verdict">${v.levels[r]}</span></div><div class="info-row"><span class="info-label">${v.status}</span><span class="availability ${a.state}">${v.states[si]} <span class="checked">· ${v.checked} ${a.checked}</span></span></div></div><span class="meta"><span class="tags">${E[x[2]]} ${d.cats[x[2]]}</span><span class="price">${['🆓','🟢','💳'][p]} ${d.prices[p]}</span></span></a>`}).join(''):`<div class="empty">${d.empty}</div>`}
function applyLang(){document.documentElement.lang=lang==='zh_cn'?'zh-CN':lang==='pt'?'pt-BR':lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));document.querySelector('#language').value=lang;renderChips();render()}
document.querySelector('#chips').addEventListener('click',e=>{if(!e.target.dataset.cat)return;cat=+e.target.dataset.cat;document.querySelector('#sectionTitle').textContent=cat?t('cats')[cat]:t('allSites');renderChips();render()});q.addEventListener('input',render);document.querySelector('#focusSearch').onclick=()=>q.focus();document.querySelector('#random').onclick=()=>{const rows=S.filter(x=>cat===0||x[2]===cat);const x=rows[Math.floor(Math.random()*rows.length)];window.open(x[1],'_blank','noopener')};document.querySelector('#language').onchange=e=>{lang=e.target.value;try{localStorage.setItem('atlas-lang',lang)}catch(err){}applyLang()};const themeButton=document.querySelector('#theme');function applyTheme(theme){document.documentElement.dataset.theme=theme;themeButton.textContent=theme==='dark'?'☀':'◐';document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#11120f':'#f2f0e8'}let theme;try{theme=localStorage.getItem('atlas-theme')}catch(e){}applyTheme(theme||((window.matchMedia&&matchMedia('(prefers-color-scheme:dark)').matches)?'dark':'light'));themeButton.onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(next);try{localStorage.setItem('atlas-theme',next)}catch(e){}};document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();q.focus()}if(e.key==='Escape'){q.value='';q.blur();render()}});document.querySelector('#siteCount').textContent=S.length;applyLang();
</script>
